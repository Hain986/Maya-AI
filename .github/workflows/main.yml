name: Build Maya AI APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build Direct Debug APK with Gradle
      run: gradle assembleDirectDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: maya-ai-direct-debug
        path: app/build/outputs/apk/direct/debug/app-direct-debug.apk

